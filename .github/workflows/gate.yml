name: Product gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet build -warnaserror
      - run: dotnet test tests/Unit --no-build
      - run: dotnet test tests/Architecture --no-build
      - run: npm ci && npm run build
        working-directory: src/web
      - run: python3 harness/verify.py contract
      - run: POSTGRES_PASSWORD=ci docker compose config --quiet
      - if: hashFiles('tests/Acceptance/*.csproj') != ''
        run: python3 harness/verify.py local
